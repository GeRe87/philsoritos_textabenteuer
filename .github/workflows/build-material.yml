name: Build exercise document

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/build_exercise.py
      - .github/workflows/build-material.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install document dependencies
        run: python -m pip install --disable-pip-version-check python-docx pillow matplotlib

      - name: Build Word exercise
        run: |
          python tools/build_exercise.py
          mkdir -p material
          cp build/mikroplastik_formatierungsuebung.docx material/mikroplastik_formatierungsuebung.docx

      - name: Commit generated Word file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add material/mikroplastik_formatierungsuebung.docx
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build exercise document"
            git push
          fi
